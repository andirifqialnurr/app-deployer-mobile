plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def androidKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def androidKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def androidKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def androidKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningReady = [
    androidKeystoreFile,
    androidKeystorePassword,
    androidKeyAlias,
    androidKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException(
        "Release signing is not configured. Set ANDROID_KEYSTORE_FILE, " +
        "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
    )
}

android {
    namespace "com.appdeployer.mobile"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.appdeployer.mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    // Keep Java and Kotlin bytecode targets aligned. The Flutter builder uses
    // JDK 21, while Android Gradle Plugin 8.6 is built around Java 17.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(androidKeystoreFile)
                storePassword androidKeystorePassword
                keyAlias androidKeyAlias
                keyPassword androidKeyPassword
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}

flutter {
    source "../.."
}
